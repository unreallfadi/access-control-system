<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — DBA Access Control</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0d0d0d;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-box {
            background: #141414;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 40px;
            width: 360px;
        }
        h1 { font-size: 18px; color: #00aaff; margin-bottom: 4px; }
        p  { font-size: 12px; color: #666; margin-bottom: 28px; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 9px 12px;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus { border-color: #00aaff; }
        button {
            width: 100%;
            background: #00aaff;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }
        button:hover { opacity: 0.85; }
        .flash-error {
            background: rgba(255,61,61,0.1);
            border: 1px solid rgba(255,61,61,0.3);
            color: #ff3d3d;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="login-box">
    <h1>DBA Access Control</h1>
    <p>Multi-User Database Management System</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Sign In</button>
    </form>
</div>
</body>
</html>
